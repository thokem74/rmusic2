name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: stable

jobs:
  cargo:
    name: Cargo checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install stable Rust with formatter and linter
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Test verification runner
        run: python3 scripts/test_check.py
      - name: Run shared Cargo checks
        run: ./scripts/check
